services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./db:/app/db
      - ./certificados_armazenados:/app/certificados_armazenados
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./settings.json:/app/settings.json
    restart: unless-stopped
