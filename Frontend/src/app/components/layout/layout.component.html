<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
  <app-toast-container></app-toast-container>
  <!-- Sidebar Lateral Colapsável -->
  <aside class="sidebar" [class.sidebar-collapsed]="sidebarCollapsed">
    <!-- Logo + Nome do Sistema / Toggle -->
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <span class="brand-name">AutoNacional</span>
      </div>
      <button
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [attr.title]="sidebarCollapsed ? 'Expandir' : 'Recolher'"
        type="button"
      >
        @if (sidebarCollapsed) {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 5l7 7-7 7"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        }
      </button>
    </div>

    <!-- Navegação -->
    <nav class="sidebar-nav">
      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        [attr.title]="sidebarCollapsed ? 'Home' : null"
      >
        <span class="nav-icon-wrap" [class.active]="currentRoute === 'home'">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </span>
        <span class="nav-label">Home</span>
      </a>
      <a
        routerLink="/empresas"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="sidebarCollapsed ? 'Empresas' : null"
      >
        <span class="nav-icon-wrap" [class.active]="currentRoute === 'empresas'">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </span>
        <span class="nav-label">Empresas</span>
      </a>
      <a
        routerLink="/execucao"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="sidebarCollapsed ? 'Execução' : null"
      >
        <span class="nav-icon-wrap" [class.active]="currentRoute === 'execucao'">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
          </svg>
        </span>
        <span class="nav-label">Execução</span>
      </a>
      <a
        routerLink="/contabilidades"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="sidebarCollapsed ? 'Contabilidades' : null"
      >
        <span class="nav-icon-wrap" [class.active]="currentRoute === 'contabilidades'">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </span>
        <span class="nav-label">Contabilidades</span>
      </a>
      <a
        routerLink="/configuracoes"
        routerLinkActive="active"
        class="nav-item"
        [attr.title]="sidebarCollapsed ? 'Configurações' : null"
      >
        <span class="nav-icon-wrap" [class.active]="currentRoute === 'configuracoes'">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </span>
        <span class="nav-label">Configurações</span>
      </a>
    </nav>

    <!-- Footer colapsável -->
    <div class="sidebar-footer">
      <button
        class="nav-item nav-collapse-btn"
        (click)="toggleSidebar()"
        [attr.title]="sidebarCollapsed ? 'Expandir' : 'Recolher'"
        type="button"
      >
        <span class="nav-icon-wrap">
          @if (sidebarCollapsed) {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          } @else {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          }
        </span>
        <span class="nav-label">Recolher</span>
      </button>
    </div>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    <div class="main-inner">
      <app-header></app-header>
      <div [@routeAnimations]="getRouteOutletState(outlet)" class="main-content">
        <router-outlet #outlet="outlet"></router-outlet>
      </div>
    </div>
  </div>
</div>
