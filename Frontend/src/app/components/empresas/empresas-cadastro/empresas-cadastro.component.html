@if (isOpen) {
  <div class="cadastro-overlay" (click)="fechar()">
    <div class="cadastro-card" (click)="$event.stopPropagation()">
      <div class="cadastro-header">
        <h2 class="cadastro-title">Cadastrar Empresa</h2>
        <button
          type="button"
          class="cadastro-close"
          (click)="fechar()"
          aria-label="Fechar"
        >
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      @if (contabilidadeObrigatoriaMsg) {
        <div class="cadastro-alert cadastro-alert-warn">{{ contabilidadeObrigatoriaMsg }}</div>
      }
      @if (erro) {
        <div class="cadastro-alert cadastro-alert-error">{{ erro }}</div>
      }

      <div class="cadastro-body">
        <!-- Contabilidade (obrigatório) -->
        <div class="cadastro-field">
          <label class="cadastro-label">
            Contabilidade <span class="required">*</span>
          </label>
          <select
            [(ngModel)]="contabilidadeId"
            class="cadastro-select"
            [disabled]="loadingContabilidades"
          >
            <option [ngValue]="null">Selecione...</option>
            @for (c of contabilidades; track c.id) {
              <option [ngValue]="c.id">{{ c.nome_contabilidade }}</option>
            }
          </select>
          @if (loadingContabilidades) {
            <span class="cadastro-loading">Carregando...</span>
          }
        </div>

        <!-- Tabs método -->
        <div class="cadastro-tabs">
          <button
            type="button"
            class="cadastro-tab"
            [class.cadastro-tab-active]="metodo === 'cert'"
            (click)="onSelectMetodo('cert')"
          >
            Certificado Digital
          </button>
          <button
            type="button"
            class="cadastro-tab"
            [class.cadastro-tab-active]="metodo === 'cred'"
            (click)="onSelectMetodo('cred')"
          >
            Credenciais
          </button>
        </div>

        @if (metodo === 'cert') {
          <div class="cadastro-section">
            <input
              #fileInput
              type="file"
              accept=".pfx,.p12"
              (change)="onFileSelected($event)"
              class="cadastro-file-hidden"
            />
            <button
              type="button"
              class="cadastro-btn-import"
              (click)="acionarFileInput(fileInput)"
              [disabled]="isSaving"
            >
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              Importar certificado digital
            </button>
            @if (certFile) {
              <p class="cadastro-file-name">{{ certFile.name }}</p>
              <div class="cadastro-field">
                <label class="cadastro-label">
                  Senha do certificado <span class="required">*</span>
                </label>
                <input
                  type="password"
                  [(ngModel)]="certSenha"
                  class="cadastro-input"
                  placeholder="Senha do arquivo .pfx"
                  [disabled]="isSaving"
                  autocomplete="off"
                />
              </div>
            }
          </div>
        }

        @if (metodo === 'cred') {
          <div class="cadastro-section">
            <!-- Tipo de documento: CNPJ ou CPF -->
            <div class="cadastro-field">
              <label class="cadastro-label">Tipo de documento</label>
              <div class="cadastro-tabs cadastro-tabs-small">
                <button
                  type="button"
                  class="cadastro-tab"
                  [class.cadastro-tab-active]="tipoDocumento === 'CNPJ'"
                  (click)="onSelectTipoDocumento('CNPJ')"
                >
                  CNPJ
                </button>
                <button
                  type="button"
                  class="cadastro-tab"
                  [class.cadastro-tab-active]="tipoDocumento === 'CPF'"
                  (click)="onSelectTipoDocumento('CPF')"
                >
                  CPF
                </button>
              </div>
            </div>
            <div class="cadastro-field">
              <label class="cadastro-label">
                {{ tipoDocumento }} <span class="required">*</span>
              </label>
              <input
                type="text"
                [(ngModel)]="credDocumento"
                (ngModelChange)="onDocumentoInput($event)"
                class="cadastro-input"
                [placeholder]="tipoDocumento === 'CPF' ? '000.000.000-00' : '00.000.000/0000-00'"
                [maxlength]="tipoDocumento === 'CPF' ? 14 : 18"
                [disabled]="isSaving"
              />
            </div>
            <div class="cadastro-field">
              <label class="cadastro-label">
                Razão Social <span class="required">*</span>
              </label>
              <input
                type="text"
                [(ngModel)]="credRazao"
                class="cadastro-input"
                placeholder="Nome da empresa"
                [disabled]="isSaving"
              />
            </div>
            <div class="cadastro-field">
              <label class="cadastro-label">
                Senha <span class="required">*</span>
              </label>
              <input
                type="password"
                [(ngModel)]="credSenha"
                class="cadastro-input"
                placeholder="Senha de acesso"
                [disabled]="isSaving"
                autocomplete="new-password"
              />
            </div>
          </div>
        }
      </div>

      <div class="cadastro-footer">
        <button
          type="button"
          class="cadastro-btn cadastro-btn-cancel"
          (click)="onCancelar()"
          [disabled]="isSaving"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="cadastro-btn cadastro-btn-primary"
          (click)="onSalvar()"
          [disabled]="!isFormValid || isSaving"
        >
          {{ isSaving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </div>
  </div>
}
